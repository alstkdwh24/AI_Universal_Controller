plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Spring_AI_training2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0-M6")
}

dependencies {
    // 데이터베이스 h2
    implementation 'org.springframework.boot:spring-boot-h2console'
    // mustache 의존성
    implementation 'org.springframework.boot:spring-boot-starter-mustache'
    // thymeleaf 의존성
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // start web 의존성
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 마이바티스 의존성
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    // 벡터db RAG를 구현할 때 필요한  QuestionAnswerAdvisor를 포함하는 라이브러리
    // AI 채팅을 할때Vector Store에서 관련 문서를 자동으로 검색해서 ai에 넘겨주는 중간 관리자 역할
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
    // 메모리에 채팅 내역 저장
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory'
    // db에 채팅 내역 저장
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
    // Redis에 채팅 내역 저장
    implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-redis'
    // 제미나이 API 연결 api
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    // 제미나이 임베딩 저장
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
//    // GPT api
//    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // 구글 vertex 임베딩
//    implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding'
    // chroma 벡터 db
//    implementation 'org.springframework.ai:spring-ai-starter-vector-store-chroma'
    // elasticsearch 벡터 db
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-elasticsearch'
    // lombok 의존성
    compileOnly 'org.projectlombok:lombok'
    // 데브툴
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // 도커 의존성
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    // h2 데이터 베이스
    runtimeOnly 'com.h2database:h2'
    // 도커 의존성
    developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'
    // lombok 의존성
    annotationProcessor 'org.projectlombok:lombok'
    // mustache 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-mustache-test'
    // thymeleaf 의존성
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    // web mvc 의존성 JUnit 5 테스트 실행 도구 Mockito 가짜 객체 만드는 도구 MockMvc 컨트롤러 테스트 도구 AssertJ 검증 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 마이바티스 4버전
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
    // 롬북
    testCompileOnly 'org.projectlombok:lombok'
    // 주피터 노트북
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 롬북
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 레디스 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'    // JSR = Java Specification Request
    // 310 = Java 8에서 추가된 날짜/시간 API 표준 번호
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'


}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
