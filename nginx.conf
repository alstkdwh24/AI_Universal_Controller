server {
    listen 80;

    # Docker 내부 DNS resolver - 컨테이너 이름을 동적으로 해석
    resolver 127.0.0.11 valid=30s;

    # React 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # MembersSecurity API 프록시 (8086)
    location /login/ {
        set $members ${MEMBER_SECURITY_URL};
        proxy_pass $members;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # JO_GPT_PROGRAM API 프록시 (8082)
    location /contents/ {
        set $jogpt ${JO_GPT_PROGRAM_URL};
        proxy_pass $jogpt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}