server {
    listen 80;

    # React 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # MembersSecurity API 프록시 (8086)
    location /login/ {
        proxy_pass http://members-security:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # JO_GPT_PROGRAM API 프록시 (8082)
    location /contents/ {
        proxy_pass http://jo-gpt:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}